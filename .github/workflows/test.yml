name: Test and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.11.13'
      - name: Tests, lint, source build, and wheel checks
        env:
          UV_PYTHON: '3.12'
        run: bash check.sh
      - name: Import the installed wheel outside the checkout
        run: |
          uv venv /tmp/sera-wheel-check --python 3.12
          uv pip install --python /tmp/sera-wheel-check/bin/python dist/*.whl
          cd /tmp
          /tmp/sera-wheel-check/bin/python -I -c 'import sera, sera_loop; from importlib.resources import files; assert callable(sera.Optimize); assert callable(sera_loop.optimize); assert files("sera").joinpath("replay.html").read_text(); assert files("sera").joinpath("demo_cases.json").read_text(); print(sera.__file__)'
          /tmp/sera-wheel-check/bin/sera --help
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz
