[project]
name = "sera"
version = "0.1.0"
description = "An agentic inference optimization team: specialists propose, an arbiter spends a trial budget, a ledger remembers everything including the reverts."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Tracing + notebook presentation layer
demo = [
    "weave>=0.51",
    "wandb>=0.17",
    "marimo>=0.9",
    "altair>=5.0",
    "pandas>=2.0",
]
# LLM-backed specialists (OpenAI-compatible client for the W&B/CoreWeave endpoint)
agents = [
    "openai>=1.40",
]
# Real GPU trial substrate
gpu = [
    "vllm>=0.6",
    "torch>=2.4",
    "transformers>=4.44",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sera"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
