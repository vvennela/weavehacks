[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sera-inference"
version = "0.2.0"
description = "The autonomous auto-research harness for inference"
readme = {text = """
Sera — the autonomous auto-research harness for inference.

Run `sera` or `sera setup` to install the hardware runtime, connect your Codex
ChatGPT login, register models and quality checks, connect document collections,
configure operator-owned W&B tracing, and start the local service.

Then run `sera optimize 'Describe your workload' --examples checks.json`, or
call `sera.Optimize(description, examples=checks)` from Python. Use
`documents='collection-name'` for document question answering. Setup saves the
local access key; it does not bundle operator credentials into the package.

Inference experiments run on the registered hardware within fixed quality and
budget limits. JSON reference answers and explicit text checks grade supplied
examples; they do not certify arbitrary semantic quality. FP4 and INT4 are
distinct formats. Requested formats are enforced, and failures remain visible.
""", content-type = "text/plain"}
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# pydantic and prometheus-client belong to the swarm line; pyyaml and numpy to the
# two-phase loop. Both packages ship from this project, so both sets are required.
dependencies = [
    "pydantic>=2.12,<3",
    "prometheus-client>=0.21,<1",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6", "safetensors>=0.6,<1"]
agent = ["openai>=2,<4"]
litellm = ["litellm==1.82.0"]
# Weave creates httpx.BasicAuth. gql 4.4 can select httpx2 and reject that object.
swarm = ["weave==0.53.2", "gql[httpx]==4.0.0", "openai>=2,<4"]
# Tested native Apple runtime; inference workers do not need the swarm extra.
mlx = [
    "mlx==0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "transformers==5.17.0",
    "outlines==1.3.3",
]
# Install the matching ROCm PyTorch build before this extra. Device checks reject
# CPU/CUDA builds; the AMD hardware matrix has not yet been validated by Sera.
rocm = [
    "transformers==5.17.0", "outlines==1.3.3",
    "bitsandbytes==0.50.2", "accelerate>=1,<2",
]
# Packed CUDA export; device support remains subject to real GPU validation.
modelopt = [
    "nvidia-modelopt==0.46.1; sys_platform == 'linux'",
    "transformers==5.17.0", "accelerate>=1,<2",
]
# Native ModelOpt research and sealed-checkpoint inference on Linux NVIDIA hosts.
cuda = [
    "nvidia-modelopt==0.46.1; sys_platform == 'linux'",
    "vllm==0.30.0; sys_platform == 'linux'",
    "nvidia-ml-py>=12,<14; sys_platform == 'linux'",
    "transformers==5.17.0", "accelerate>=1,<2",
]
# Notebook presentation layer for the two-phase loop. Weave is deliberately absent:
# the swarm extra pins it, and a second range here would only argue with that pin.
demo = [
    "wandb>=0.17",
    "marimo>=0.9",
    "altair>=5.0",
    "pandas>=2.0",
]
# Real GPU trial substrate
gpu = [
    "vllm>=0.6",
    "torch>=2.4",
    "transformers>=4.44",
]

[project.scripts]
sera = "sera.__main__:main"
sera-provider-check = "sera.provider_check:main"
sera-serve = "sera.managed_service:main"

[tool.hatch.build.targets.wheel]
packages = ["sera", "src/sera_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." resolves `sera` (the swarm line), "src" resolves `sera_loop` (the two-phase
# loop). Two packages, two names, no shadowing.
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
